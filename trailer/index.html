<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>LETV trailer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#c9cfd8;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}
#player,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#note{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 24px}
</style>
</head>
<body>
<div id="player"></div><div id="note" hidden></div>
<script>
// LETV opens trailers here as .../trailer/#<YouTube id>. YouTube won't play inside apps that load
// from local files (Samsung TV, Windows, Mac), so the player sits on this https page instead.
// The app hears {letvTrailer: 1, ev: "ready" | "playing" | "ended" | "error"} back.
(function () {
  var id = (location.hash || "").slice(1).split("&")[0];
  function send(msg) {
    msg.letvTrailer = 1;
    try { parent.postMessage(JSON.stringify(msg), "*"); } catch (e) {}
  }
  function show(text, code) {
    var n = document.getElementById("note");
    n.textContent = text;
    n.hidden = false;
    send({ ev: "error", code: code || 0 });
  }
  if (!/^[\w-]{6,20}$/.test(id)) return show("No trailer to play.", -1);
  window.onYouTubeIframeAPIReady = function () {
    new YT.Player("player", {
      host: "https://www.youtube-nocookie.com",
      videoId: id,
      playerVars: { autoplay: 1, rel: 0, playsinline: 1, iv_load_policy: 3, fs: 0, origin: location.origin },
      events: {
        onReady: function (e) {
          try { e.target.playVideo(); } catch (x) {}
          send({ ev: "ready" });
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) send({ ev: "playing" });
          if (e.data === YT.PlayerState.ENDED) send({ ev: "ended" });
        },
        onError: function (e) {
          show(e.data === 101 || e.data === 150
            ? "This trailer only plays on YouTube itself."
            : "This trailer can't play right now.", e.data);
        }
      }
    });
  };
  var api = document.createElement("script");
  api.src = "https://www.youtube.com/iframe_api";
  api.onerror = function () { show("Couldn't reach YouTube.", -2); };
  document.head.appendChild(api);
})();
</script>
</body>
</html>
